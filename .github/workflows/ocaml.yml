name: OCaml

on:
  push:
    branches: [main, ocaml]
    paths: ["bin/**", "lib/**", "test/**", "dune", "dune-project", "dune-workspace", "dune.lock/**", ".github/workflows/ocaml.yml"]
  pull_request:
    paths: ["bin/**", "lib/**", "test/**", "dune", "dune-project", "dune-workspace", "dune.lock/**", ".github/workflows/ocaml.yml"]

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64 }
          - { os: macos-15, target: macos-arm64 }
    steps:
      - uses: actions/checkout@v4

      # Install dune and build the locked dependencies (mostly the OCaml
      # compiler). setup-dune caches them between runs.
      - uses: ocaml-dune/setup-dune@v2
        with:
          steps: install-dune enable-pkg install-gpatch install-depexts build-deps

      - run: dune build --release

      - run: dune test

      - name: Package binary
        run: |
          mkdir -p dist
          cp _build/default/bin/main.exe dist/butler-${{ matrix.target }}
          chmod +x dist/butler-${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: butler-${{ matrix.target }}
          path: dist/butler-${{ matrix.target }}

  # Publish the binaries to a rolling "nightly" release, so they can be
  # downloaded without being logged in to GitHub.
  nightly:
    name: publish nightly release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: butler-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          shasum -a 256 butler-* > checksums.txt
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly butler-* checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly" \
            --notes "Automated build of ${GITHUB_SHA}. Binaries are not signed; run chmod +x after download."
